name: Import full WorldForge source archive

on:
  push:
    paths:
      - worldforge-source.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: 
github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Import full WorldForge source archive'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and extract archive
        shell: bash
        run: |
          set -euo pipefail
          test -s worldforge-source.zip
          python - <<'PY'
          from pathlib import Path
          import shutil
          import tempfile
          import zipfile

          root = Path.cwd().resolve()
          archive = root / 'worldforge-source.zip'
          with zipfile.ZipFile(archive) as zf:
              names = zf.namelist()
              for name in names:
                  p = Path(name)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'unsafe archive path: {name}')
              with tempfile.TemporaryDirectory() as td:
                  tmp = Path(td).resolve()
                  zf.extractall(tmp)
                  for src in tmp.rglob('*'):
                      if src.is_file():
                          rel = src.relative_to(tmp)
                          if rel.as_posix() == 'worldforge-source.zip':
                              continue
                          dst = root / rel
                          dst.parent.mkdir(parents=True, exist_ok=True)
                          shutil.copy2(src, dst)
          PY
          rm -f worldforge-source.zip
      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Import full WorldForge source archive'
          git push
